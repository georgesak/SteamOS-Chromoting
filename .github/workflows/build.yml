name: Build & Package SteamOS-Chromoting

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PipeWire & build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpipewire-0.3-dev build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build steamos-crd-bridge (release)
        run: cargo build --release

      - name: Package portable SteamOS tarball
        run: |
          mkdir -p dist
          cp target/release/steamos-crd-bridge dist/steamos-crd-bridge
          ./scripts/package-release.sh

      - name: Upload release tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: steamos-chromoting-linux-x86_64
          path: dist/steamos-chromoting-linux-x86_64.tar.gz

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/steamos-chromoting-linux-x86_64.tar.gz
