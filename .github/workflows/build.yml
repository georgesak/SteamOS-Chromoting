name: Build & Package SteamOS-Chromoting

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PipeWire & build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpipewire-0.3-dev build-essential desktop-file-utils

      - name: Validate desktop launcher
        run: desktop-file-validate Install-SteamOS-Chromoting.desktop

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build steamos-crd-bridge (release)
        run: cargo build --release

      - name: Validate Decky Python backend syntax
        run: python3 -m py_compile decky-plugin/main.py

      - name: Build & Package Decky Plugin (.zip)
        run: |
          FORCE_BUILD=1 bash ./scripts/package-decky-plugin.sh

      - name: Package portable SteamOS tarball
        run: |
          mkdir -p dist
          cp target/release/steamos-crd-bridge dist/steamos-crd-bridge
          bash ./scripts/package-release.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: steamos-chromoting-linux-x86_64
          path: |
            dist/steamos-chromoting-linux-x86_64.tar.gz
            dist/steamos-chromoting-decky.zip
            dist/Install-SteamOS-Chromoting.desktop
            dist/install.sh

      - name: Publish GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/steamos-chromoting-linux-x86_64.tar.gz
            dist/steamos-chromoting-decky.zip
            dist/Install-SteamOS-Chromoting.desktop
            dist/install.sh
